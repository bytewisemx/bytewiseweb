<!-- BOTÓN PRINCIPAL INTUITIVO DE CHATBOT (ESQUINA SUPERIOR DERECHA) -->
<button class="chatbot-trigger-btn" (click)="toggleChatbot()" aria-label="Abrir asistente de IA">
  <span class="chat-pulse-node"></span>
  <svg class="chat-icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
  <span class="btn-text">ByteWise AI</span>
</button>

<!-- VENTANA / DRAWER DEL CHATBOT CON ESTILO DOBLE BORDE TRANSPARENTE -->
<div class="chatbot-drawer" [class.open]="isOpen">
  <!-- Cabecera de la Ventana -->
  <div class="chatbot-header">
    <div class="bot-info-group">
      <div class="bot-avatar-container">
        <img src="img/escudo.png" alt="ByteWise Shield" class="bot-avatar-img" />
        <span class="bot-online-indicator"></span>
      </div>
      <div class="bot-title-box">
        <div class="bot-name">ByteWise AI</div>
        <div class="bot-status">Neural Engine • n8n en línea</div>
      </div>
    </div>
    <button class="btn-close-chatbot" (click)="closeChatbot()" aria-label="Cerrar chat">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Contenedor de Mensajes -->
  <div class="chatbot-body" #messagesContainer>
    <div class="messages-list">
      @for (msg of messages; track msg.id) {
        <div class="chat-bubble-wrapper" [class.user]="msg.sender === 'user'" [class.bot]="msg.sender === 'bot'">
          @if (msg.sender === 'bot') {
            <div class="bubble-avatar">
              <img src="img/escudo.png" alt="Shield" />
            </div>
          }
          <div class="chat-bubble">
            <p class="bubble-text">{{ msg.text }}</p>
            <span class="bubble-time">{{ msg.timestamp | date:'HH:mm' }}</span>
          </div>
        </div>
      }

      @if (isLoading) {
        <div class="chat-bubble-wrapper bot">
          <div class="bubble-avatar">
            <img src="img/escudo.png" alt="Shield" />
          </div>
          <div class="chat-bubble typing">
            <div class="typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- Prompts Rápidos Sugeridos -->
    @if (messages.length <= 2) {
      <div class="quick-prompts-container">
        <span class="quick-title">Preguntas sugeridas:</span>
        <div class="quick-chips">
          @for (prompt of quickPrompts; track prompt) {
            <button class="quick-chip" (click)="sendQuickPrompt(prompt)">
              {{ prompt }}
            </button>
          }
        </div>
      </div>
    }
  </div>

  <!-- Footer con Input de Texto -->
  <div class="chatbot-footer">
    <form (ngSubmit)="sendMessage()" class="chat-input-form">
      <input type="text" 
             [(ngModel)]="userInput" 
             name="userInput" 
             placeholder="Escribe tu consulta sobre ciberseguridad o TI..." 
             class="chat-input-field" 
             [disabled]="isLoading"
             autocomplete="off" />
      <button type="submit" class="btn-send-chat" [disabled]="!userInput.trim() || isLoading">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </form>
  </div>
</div>

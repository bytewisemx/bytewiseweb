<header class="navbar-header" [class.scrolled]="isScrolled">
    <div class="navbar-container">
        <a href="#" class="nav-logo">
            <img src="img/logooficial.png" alt="ByteWise Logo" class="logo-img">
        </a>
        
        <nav class="nav-menu" (mouseleave)="onNavMouseLeave()">
            <div class="liquid-indicator" [ngStyle]="indicatorStyle"></div>
            <a #linkHero href="#hero" class="nav-link" [class.active]="activeLink === 'hero'" (mouseenter)="onLinkHover($event)" (click)="setLink('hero', $event)">Inicio</a>
            <a #linkFeatures href="#features" class="nav-link" [class.active]="activeLink === 'features'" (mouseenter)="onLinkHover($event)" (click)="setLink('features', $event)">Servicios</a>
            <a #linkStats href="#stats" class="nav-link" [class.active]="activeLink === 'stats'" (mouseenter)="onLinkHover($event)" (click)="setLink('stats', $event)">Impacto</a>
            <a #linkContact href="#contact" class="nav-link" [class.active]="activeLink === 'contact'" (mouseenter)="onLinkHover($event)" (click)="setLink('contact', $event)">Contacto</a>
        </nav>
    </div>
</header>
